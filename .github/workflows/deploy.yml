name: Deploy static site to GitHub Pages

on:
  # 推送到 master 时自动发布
  push:
    branches: [ master ]
  # 允许在 Actions 页面手动触发
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只跑一个部署，避免并发写坏 Pages
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      # 本站是无构建的纯静态站点，直接把仓库根目录整体上传。
      # upload-pages-artifact 内部会排除 .git / .github 及顶层点文件，
      # 因此无需 .nojekyll，也不会把 git 历史打进产物。
      - name: Upload static files
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
